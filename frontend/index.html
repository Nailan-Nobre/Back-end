<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackaton - Minhas Disciplinas</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f8f9fa;
      font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    .bg-dark-custom {
      background: #0f1115 !important;
    }

    .btn-primary {
      background: #2c3e66;
      border: none;
      border-radius: 2rem;
      padding: 0.6rem 1.5rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary:hover {
      background: #1e2a4a;
      transform: scale(0.98);
    }

    /* Estilo dos cards idêntico ao padrão do projeto */
    .card-turma {
      border: none;
      border-radius: 1.25rem;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }

    .card-turma:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.15) !important;
    }

    /* Oculta o botão por padrão e mostra no hover da turma */
    .btn-visualizar-overlay {
      position: absolute;
      bottom: -60px; /* Escondido para baixo */
      left: 0;
      right: 0;
      text-align: center;
      padding: 1rem;
      background: linear-gradient(to top, rgba(255,255,255,1) 40%, rgba(255,255,255,0));
      transition: all 0.3s ease-in-out;
      opacity: 0;
    }

    .card-turma:hover .btn-visualizar-overlay {
      bottom: 0;
      opacity: 1;
    }
    
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: #ffffffcc;
      border-radius: 1.5rem;
      border: 2px dashed #dee2e6;
    }
  </style>
</head>

<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark-custom shadow-sm sticky-top">
    <div class="container position-relative">
      <a class="navbar-brand fw-bold mx-auto" href="#">
        <i class="fa-solid fa-laptop-code text-primary me-2"></i>Hackaton
      </a>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-5 border-bottom pb-3">
      <div>
        <h1 class="fw-bold display-6 text-dark mb-1">Minhas Turmas</h1>
        <p class="text-muted mb-0">Gerencie suas turmas e listas de presença.</p>
      </div>
    </div>

    <div class="row g-4" id="container-turmas">
      </div>

    <div id="estado-vazio" class="empty-state d-none mt-4">
      <i class="fa-solid fa-chalkboard-user fa-3x mb-3 text-secondary opacity-50"></i>
      <h3 class="h5 text-dark fw-semibold">Nenhuma turma cadastrada</h3>
      <p class="text-muted mb-4"></p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  
  <script>
    const TURMAS_MAP = {
      "118ISINF": "Informática",
      "118ISADM": "Administração",
      "118ISELE": "Eletrotécnica",
      "118TADS": "Ads",
      "118TFIS": "Física",
      "118TQUI": "Química",
    };

    function formatarMatriculaExemplo(ano, codigoTurma) {
      const base = `${(ano || "").trim()}${(codigoTurma || "").trim()}`;
      return base || "";
    }

    async function carregarTurmas() {
      const response = await fetch(`${API_URL}/turmas`);
      if (!response.ok) {
        throw new Error("Falha ao carregar turmas");
      }
      const data = await response.json();
      return data.turmas || [];
    }

    async function criarTurma(payload) {
      const response = await fetch(`${API_URL}/turmas`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!response.ok) {
        throw new Error("Falha ao criar turma");
      }
      return response.json();
    }

    async function renderizarTurmas() {
      let turmas = [];
      try {
        turmas = await carregarTurmas();
      } catch (error) {
        console.warn("Nao foi possivel carregar turmas.");
      }
      const container = document.getElementById("container-turmas");
      const estadoVazio = document.getElementById("estado-vazio");

      container.innerHTML = "";

      if (turmas.length === 0) {
        estadoVazio.classList.remove("d-none");
      } else {
        estadoVazio.classList.add("d-none");
        
        turmas.forEach(turma => {
          const cor = turma.cor || "#2c3e66";
          const col = document.createElement("div");
          col.className = "col-12 col-md-6 col-lg-4";
          
          col.innerHTML = `
            <div class="card card-turma h-100 shadow-sm bg-white">
              <div class="card-body p-4">
                <div class="d-flex align-items-center mb-3">
                  <div class="rounded-circle d-flex justify-content-center align-items-center me-3 shadow-sm" style="width: 48px; height: 48px; background-color: ${cor}; color: white;">
                    <i class="fa-solid fa-book fs-5"></i>
                  </div>
                  <div>
                    <h5 class="card-title fw-bold mb-0 text-truncate" style="max-width: 200px;" title="${turma.nome}">${turma.nome}</h5>
                    <span class="badge bg-light text-dark border mt-1">${turma.descricao || ""}</span>
                  </div>
                </div>
                <p class="text-muted small mb-4">Gerencie as frequências, QR Codes e alunos matriculados nesta disciplina.</p>
                
                <div class="btn-visualizar-overlay">
                  <a href="turma.html" class="btn btn-dark rounded-pill w-100 shadow">
                    <i class="fa-solid fa-eye me-2"></i>Visualizar Turma
                  </a>
                </div>
              </div>
            </div>
          `;
          container.appendChild(col);
        });
      }
    }

    // Controle do Formulário do Modal
    document.addEventListener("DOMContentLoaded", () => {
      renderizarTurmas();

      const form = document.getElementById("formCriarTurma");
      const anoInput = document.getElementById("anoTurma");
      const turmaSelect = document.getElementById("turmaDisciplina");
      const modeloAjuda = document.getElementById("modeloMatriculaAjuda");

      const atualizarExemploMatricula = () => {
        if (!modeloAjuda) return;
        const exemplo = formatarMatriculaExemplo(anoInput.value, turmaSelect.value);
        modeloAjuda.textContent = `Exemplo de matrícula completa: ${exemplo}`;
      };

      if (anoInput && turmaSelect) {
        anoInput.addEventListener("input", atualizarExemploMatricula);
        turmaSelect.addEventListener("change", atualizarExemploMatricula);
        atualizarExemploMatricula();
      }
      
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const disciplina = document.getElementById("nomeDisciplina").value.trim();
        const ano = document.getElementById("anoTurma").value.trim();
        const turmaCodigo = document.getElementById("turmaDisciplina").value;
        const turmaNome = TURMAS_MAP[turmaCodigo] || "";
        const cor = document.getElementById("corTurma").value;
        const codigo = `${ano}${turmaCodigo}`;

        try {
          await criarTurma({
            nome: disciplina,
            codigo,
            descricao: turmaNome,
            cor,
          });
          await renderizarTurmas();

          const modalElement = document.getElementById("modalNovaTurma");
          const modalInstance = bootstrap.Modal.getInstance(modalElement);
          modalInstance.hide();
          form.reset();
          atualizarExemploMatricula();
        } catch (error) {
          alert("Nao foi possivel criar a turma.");
        }
      });
    });
  </script>
</body>
</html>
