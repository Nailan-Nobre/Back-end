<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacktoon - Painel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container position-relative">

            <a class="navbar-brand fw-bold mx-auto" href="#">
                <i class="fa-solid fa-laptop-code text-primary me-2"></i>Hacktoon
            </a>

            <button class="navbar-toggler position-absolute end-0 me-3" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card border-0 shadow-lg p-4 p-sm-5 bg-white rounded-4 text-center">

                    <div class="mb-3">
                        <h1 class="fw-black display-5 text-dark mb-2">Hacktoon</h1>
                    </div>

                    <div class="row g-3 mt-2">
                        <div class="col-sm-6">
                            <div class="card h-100 border-2 border-primary-subtle hover-shadow transition">
                                <div class="card-body d-flex flex-column p-4">
                                    <i class="fa-solid fa-user-plus fa-2x text-primary mb-3"></i>
                                    <h5 class="card-title fw-bold">Registrar</h5>
                                    <p class="card-text text-muted small flex-grow-1">Ative o bot e deixe que ele faça
                                        seu trabalho.</p>
                                    <a href="/registrar" class="btn btn-primary w-100 mt-3 py-2 fw-semibold">
                                        Registrar
                                    </a>
                                </div>
                            </div>
                        </div>

                        <div class="col-sm-6">
                            <div class="card h-100 border-2 border-success-subtle hover-shadow transition">
                                <div class="card-body d-flex flex-column p-4">
                                    <i class="fa-solid fa-qrcode fa-2x text-success mb-3"></i>
                                    <h5 class="card-title fw-bold">Acesso Rápido</h5>
                                    <p class="card-text text-muted small flex-grow-1">Crie códigos QR para check-in
                                        instantâneo.</p>
                                    <a href="qrCode.html" class="btn btn-success w-100 mt-3 py-2 fw-semibold">
                                        Gerar QR
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white-50 text-center py-3 mt-auto border-top border-secondary">
        <div class="container">
            <small>&copy; Desenvolvido para professores. <i class="fa-solid  text-danger"></i></small>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
