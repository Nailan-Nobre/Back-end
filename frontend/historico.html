<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas de Chamada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <aside class="sidebar d-flex flex-column">
        <div class="brand">
            <i class="fa-solid fa-laptop-code text-primary fs-4"></i>
            <span class="nav-label fw-semibold">Hackaton</span>
        </div>
        <nav class="nav flex-column mt-2 px-1">
            <a class="nav-link d-flex align-items-center" href="menu.html">
                <i class="fa-solid fa-house fa-lg text-primary"></i>
                <span class="nav-label">Inicio</span>
            </a>
            <a class="nav-link d-flex align-items-center active" href="historico.html">
                <i class="fa fa-file-text fa-lg" style="color: #a78bfa"></i>
                <span class="nav-label">Historico</span>
            </a>
            <a class="nav-link d-flex align-items-center" href="qrCode.html">
                <i class="fa-solid fa-qrcode fa-lg text-success"></i>
                <span class="nav-label">QR Presenca</span>
            </a>
            <a class="nav-link d-flex align-items-center" href="sign_matricula.html">
                <i class="fa-solid fa-user-graduate fa-lg text-info"></i>
                <span class="nav-label">Alunos</span>
            </a>
        </nav>
        <div class="mt-auto px-3 pb-3">
            <a class="btn btn-outline-light w-100" href="index.html">
                <i class="fa-solid fa-right-from-bracket me-2"></i>Voltar para Turmas
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="container-fluid py-5 px-4 px-lg-5">
        <h1 class="mb-4">Listas de Chamada</h1>
        <div class="container py-4">
            <div id="listas-container" class="list-group">
                <!-- Listas serão inseridas aqui -->
            </div>
        </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchListas() {
            try {
                const response = await fetch('https://back-end-isvf.onrender.com/listas');
                const listas = await response.json();
                const container = document.getElementById('listas-container');
                container.innerHTML = '';

                listas
                    .sort((a, b) => new Date(b.data) - new Date(a.data))
                    .forEach(lista => {
                        const col = document.createElement('div');
                        col.className = 'col-12 col-md-6 col-lg-4';

                        const card = document.createElement('div');
                        card.className = 'card h-100 shadow-sm';

                        const cardBody = document.createElement('div');
                        cardBody.className = 'card-body d-flex flex-column';

                        const title = document.createElement('h5');
                        title.className = 'card-title';
                        title.textContent = lista.nome;

                        const date = document.createElement('p');
                        date.className = 'card-text text-muted';
                        date.textContent = new Date(lista.data).toLocaleString();

                        const link = document.createElement('a');
                        link.href = lista.url;
                        link.className = 'btn btn-primary mt-auto';
                        link.textContent = 'Abrir lista';

                        cardBody.appendChild(title);
                        cardBody.appendChild(date);
                        cardBody.appendChild(link);
                        card.appendChild(cardBody);
                        col.appendChild(card);
                        container.appendChild(col);
                    });
            } catch (error) {
                console.error('Erro ao buscar listas:', error);
            }
        }
        fetchListas();
    </script>
    <style>
        :root {
            --sidebar-width: 220px;
        }

        body {
            font-family:
                system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--sidebar-width);
            background: #0f1115;
            color: #fff;
            z-index: 1030;
        }

        .sidebar .nav-label {
            white-space: nowrap;
        }

        .sidebar .nav-link {
            color: #cbd5e1;
            border-radius: 12px;
            margin: 4px 8px;
            gap: 12px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: #1f2937;
            color: #fff;
        }

        .sidebar .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 12px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                position: static;
                width: 100%;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</body>
