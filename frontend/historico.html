<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas de Chamada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <aside class="sidebar d-flex flex-column">
        <div class="brand">
            <span class="nav-label fw-semibold" id="navTurmaNome">Hackaton</span>
        </div>

        <nav class="nav flex-column mt-2 px-1">
            <a class="nav-link d-flex align-items-center" href="menu.html" data-route="menu.html">
                <i class="fa-solid fa-house fa-lg text-primary"></i>
                <span class="nav-label">Inicio</span>
            </a>
            <a class="nav-link d-flex align-items-center active" href="historico.html" data-route="historico.html">
                <i class="fa fa-file-text fa-lg" style="color: #a78bfa"></i>
                <span class="nav-label">Historico</span>
            </a>
            <a class="nav-link d-flex align-items-center" href="qrCode.html" data-route="qrCode.html">
                <i class="fa-solid fa-qrcode fa-lg text-success"></i>
                <span class="nav-label">QR Presenca</span>
            </a>
            <a class="nav-link d-flex align-items-center" href="sign_matricula.html" data-route="sign_matricula.html">
                <i class="fa-solid fa-user-graduate fa-lg text-info"></i>
                <span class="nav-label">Alunos</span>
            </a>
        </nav>
        <div class="mt-auto px-3 pb-3">
            <a class="btn btn-outline-light w-100" href="index.html">
                <i class="fa-solid fa-right-from-bracket me-2"></i>Voltar para Turmas
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="container-fluid py-5 px-4 px-lg-5">
            <h1 class="mb-2" id="historicoTitulo">Listas de Chamada</h1>
            <p class="text-muted" id="historicoSubtitulo">Histórico de chamadas da turma.</p>
            <div class="container py-4">
                <div id="listas-container" class="row g-3"></div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const turmaNome = params.get('turma_nome') || 'Hackaton';
        const disciplinaNome = params.get('disciplina_nome') || '';
        const turmaId = params.get('turma_id');
        const disciplinaId = params.get('disciplina_id');

        const navTurmaNome = document.getElementById('navTurmaNome');
        const historicoTitulo = document.getElementById('historicoTitulo');
        const historicoSubtitulo = document.getElementById('historicoSubtitulo');

        if (navTurmaNome) {
            navTurmaNome.textContent = turmaNome;
        }

        if (historicoTitulo) {
            historicoTitulo.textContent = disciplinaNome
                ? `Listas de Chamada - ${disciplinaNome}`
                : 'Listas de Chamada';
        }

        if (historicoSubtitulo) {
            historicoSubtitulo.textContent = disciplinaNome
                ? `Turma: ${turmaNome}`
                : 'Histórico de chamadas da turma.';
        }

        const links = document.querySelectorAll('[data-route]');
        const query = params.toString();
        links.forEach((link) => {
            link.href = query ? `${link.dataset.route}?${query}` : link.dataset.route;
        });

        const listaCache = new Map();

        const formatarData = (valor) => {
            if (!valor) return '';
            const data = new Date(valor);
            return Number.isNaN(data.getTime()) ? '' : data.toLocaleDateString('pt-BR');
        };

        const formatarHora = (valor) => {
            if (!valor) return '';
            const data = new Date(valor);
            return Number.isNaN(data.getTime()) ? '' : data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        };

        const obterNomeDisciplina = (lista) => {
            if (disciplinaNome) return disciplinaNome;
            return lista.disciplina_nome || 'Disciplina';
        };

        const loadScript = (src, globalName) => new Promise((resolve, reject) => {
            if (globalName && window[globalName]) return resolve();
            const s = document.createElement('script');
            s.src = src;
            s.onload = () => resolve();
            s.onerror = () => reject(new Error('Falha ao carregar ' + src));
            document.head.appendChild(s);
        });

        const baixarXls = async (lista, registros) => {
            await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.19.3/dist/xlsx.full.min.js', 'XLSX');
            const linhas = registros.map((registro) => ({
                Nome: registro.nome || '',
                Matricula: registro.matricula || '',
                'Hora de registro': formatarHora(registro.hora_registro) || '',
                Status: registro.presente ? 'Presente' : 'Falta',
            }));
            const sheet = XLSX.utils.json_to_sheet(linhas);
            // Tentativa de aplicar cor na célula de Status (pode não ser suportado por todas as versões do writer)
            try {
                const range = XLSX.utils.decode_range(sheet['!ref']);
                for (let R = range.s.r + 1; R <= range.e.r; ++R) {
                    const statusCell = XLSX.utils.encode_cell({ r: R, c: 3 });
                    const status = sheet[statusCell] && sheet[statusCell].v;
                    if (status) {
                        // estilo básico (nem sempre respeitado pelo writer gratuito)
                        sheet[statusCell].s = {
                            font: { color: { rgb: status === 'Presente' ? 'FF008000' : 'FFFF0000' } }
                        };
                    }
                }
            } catch (e) {
                // se styling falhar, ignore e continue
            }
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, sheet, 'Presencas');
            const nomeArquivo = `${obterNomeDisciplina(lista)}-${formatarData(lista.data_aula) || 'lista'}.xlsx`;
            XLSX.writeFile(workbook, nomeArquivo);
        };

        const baixarPdf = async (lista, registros) => {
            await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js', 'jspdf');
            await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
            const { jsPDF } = window.jspdf || {};
            const doc = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
            const titulo = lista.titulo || 'Chamada';
            doc.setFontSize(16);
            doc.text(titulo, 40, 40);
            doc.setFontSize(11);
            doc.text(`Turma: ${turmaNome}`, 40, 58);
            doc.text(`Disciplina: ${obterNomeDisciplina(lista)}`, 40, 74);
            doc.text(`Data: ${formatarData(lista.data_aula)}`, 40, 90);

            doc.autoTable({
                startY: 110,
                head: [['Nome', 'Matrícula', 'Horário', 'Status']],
                body: registros.map((registro) => [
                    registro.nome || '',
                    registro.matricula || '',
                    formatarHora(registro.hora_registro) || '',
                    registro.presente ? 'Presente' : 'Falta',
                ]),
                styles: { fontSize: 10 },
                didParseCell: function (data) {
                    if (data.section === 'body' && data.row && data.row.raw) {
                        const status = data.row.raw[3];
                        if (status === 'Presente') {
                            data.cell.styles.textColor = [0, 128, 0];
                        } else if (status === 'Falta') {
                            data.cell.styles.textColor = [255, 0, 0];
                        }
                    }
                }
            });

            const nomeArquivo = `${obterNomeDisciplina(lista)}-${formatarData(lista.data_aula) || 'lista'}.pdf`;
            doc.save(nomeArquivo);
        };

        const atualizarConteudoLista = (listaId, registros) => {
            const corpo = document.getElementById(`lista-body-${listaId}`);
            if (!corpo) return;

            if (!registros.length) {
                corpo.innerHTML = '<div class="text-muted small">Nenhum aluno registrado nesta lista.</div>';
                return;
            }

            corpo.innerHTML = registros.map((registro) => {
                const presente = !!registro.presente;
                const hora = formatarHora(registro.hora_registro);
                const statusBadge = presente
                    ? `<span class="badge bg-success">Presente</span>`
                    : `<span class="badge bg-danger">Falta</span>`;
                return `
                <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                    <div>
                        <div class="fw-semibold">${registro.nome || ''}</div>
                        <div class="small text-muted">${registro.matricula || ''}</div>
                    </div>
                    <div class="text-end">
                        <div class="small">${hora || ''}</div>
                        <div class="mt-1">${statusBadge}</div>
                    </div>
                </div>
            `}).join('');
        };

        const carregarPresencasDaLista = async (lista) => {
            if (listaCache.has(lista.id)) {
                atualizarConteudoLista(lista.id, listaCache.get(lista.id));
                return listaCache.get(lista.id);
            }

            const resposta = await fetch(`${API_URL}/listas/${lista.id}/presencas`);
            if (!resposta.ok) {
                throw new Error('Falha ao carregar presenças da lista');
            }
            const data = await resposta.json();
            const registros = data.registros || [];
            listaCache.set(lista.id, registros);
            atualizarConteudoLista(lista.id, registros);
            return registros;
        };

        const criarCardLista = (lista) => {
            const col = document.createElement('div');
            col.className = 'col-12';

            const card = document.createElement('div');
            card.className = 'card shadow-sm border-0';

            const cabecalho = document.createElement('div');
            cabecalho.className = 'card-body d-flex flex-wrap justify-content-between align-items-center gap-3';

            const info = document.createElement('div');
            const disciplinaTexto = lista.disciplina_nome || disciplinaNome || 'Disciplina';
            info.innerHTML = `
                <div class="fw-semibold fs-5">${lista.titulo || 'Chamada'}</div>
                <div class="small text-muted">${turmaNome} • ${disciplinaTexto} • ${formatarData(lista.data_aula)}</div>
            `;

            const acoes = document.createElement('div');
            acoes.className = 'd-flex align-items-center gap-2';

            const btnExpandir = document.createElement('button');
            btnExpandir.type = 'button';
            btnExpandir.className = 'btn btn-outline-primary btn-sm';
            btnExpandir.setAttribute('data-bs-toggle', 'collapse');
            btnExpandir.setAttribute('data-bs-target', `#collapse-${lista.id}`);
            btnExpandir.setAttribute('aria-expanded', 'false');
            btnExpandir.innerHTML = '<i class="fa-solid fa-chevron-down me-2"></i>Expandir';

            const dropdown = document.createElement('div');
            dropdown.className = 'dropdown';
            dropdown.innerHTML = `
                <button class="btn btn-outline-secondary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fa-solid fa-download me-2"></i>Baixar
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><button class="dropdown-item" type="button" data-export="pdf">PDF</button></li>
                    <li><button class="dropdown-item" type="button" data-export="xls">XLS</button></li>
                </ul>
            `;

            acoes.appendChild(btnExpandir);
            acoes.appendChild(dropdown);
            cabecalho.appendChild(info);
            cabecalho.appendChild(acoes);

            const collapse = document.createElement('div');
            collapse.className = 'collapse';
            collapse.id = `collapse-${lista.id}`;

            const collapseBody = document.createElement('div');
            collapseBody.className = 'card-footer bg-transparent border-0 pt-0';
            collapseBody.innerHTML = `<div id="lista-body-${lista.id}" class="pt-2 text-muted small">Clique em expandir para ver os alunos desta lista.</div>`;
            collapse.appendChild(collapseBody);

            btnExpandir.addEventListener('click', async () => {
                const icon = btnExpandir.querySelector('i');
                const isOpen = collapse.classList.contains('show');
                if (icon) {
                    icon.className = isOpen ? 'fa-solid fa-chevron-down me-2' : 'fa-solid fa-chevron-up me-2';
                }
                if (!isOpen) {
                    try {
                        await carregarPresencasDaLista(lista);
                    } catch (error) {
                        atualizarConteudoLista(lista.id, []);
                    }
                }
            });

            dropdown.querySelectorAll('[data-export]').forEach((botao) => {
                botao.addEventListener('click', async () => {
                    const formato = botao.getAttribute('data-export');
                    const registros = listaCache.has(lista.id) ? listaCache.get(lista.id) : await carregarPresencasDaLista(lista);
                    if (formato === 'pdf') {
                        baixarPdf(lista, registros);
                    } else {
                        baixarXls(lista, registros);
                    }
                });
            });

            card.appendChild(cabecalho);
            card.appendChild(collapse);
            col.appendChild(card);
            return col;
        };

        async function fetchListas() {
            try {
                const queryParams = new URLSearchParams();
                if (turmaId) {
                    queryParams.set('turma_id', turmaId);
                }
                if (disciplinaId) {
                    queryParams.set('disciplina_id', disciplinaId);
                }
                const url = queryParams.toString()
                    ? `${API_URL}/listas?${queryParams.toString()}`
                    : `${API_URL}/listas`;
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error('Falha ao buscar listas');
                }
                const data = await response.json();
                const listas = data.listas || [];
                const container = document.getElementById('listas-container');
                container.innerHTML = '';

                if (!listas.length) {
                    const empty = document.createElement('div');
                    empty.className = 'text-muted';
                    empty.textContent = 'Nenhuma lista registrada ainda.';
                    container.appendChild(empty);
                    return;
                }

                listas
                    .sort((a, b) => new Date(b.data_aula) - new Date(a.data_aula))
                    .forEach((lista) => {
                        container.appendChild(criarCardLista(lista));
                    });
            } catch (error) {
                console.error('Erro ao buscar listas:', error);
            }
        }
        fetchListas();
    </script>
    <style>
        :root { --sidebar-width: 220px; }
        body {
            background-color: #f8f9fa;
            font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }
        .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); background: #0f1115; color: #fff; z-index: 1030; }
        .sidebar .nav-label { white-space: nowrap; }
        .sidebar .nav-link { color: #cbd5e1; border-radius: 12px; margin: 4px 8px; gap: 12px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1f2937; color: #fff; }
        .sidebar .brand { display:flex; align-items:center; justify-content:center; gap:12px; padding:20px 12px 12px; border-bottom:1px solid rgba(255,255,255,0.08); }
        .main-content { margin-left: var(--sidebar-width); min-height:100vh; }
        .card { border: none; border-radius: 1.25rem; transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.1) !important; }
        .btn-primary { background: #2c3e66; border: none; border-radius: 2rem; padding: 0.6rem 1.5rem; font-weight: 500; transition: all 0.2s; }
        .btn-primary:hover { background: #1e2a4a; transform: scale(0.98); }
        @media (max-width: 991.98px) { .sidebar { position: static; width: 100%; } .main-content { margin-left: 0; } }
    </style>
</body>

</html>
