<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas de Chamada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
     <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container position-relative">
            <a class="btn btn-outline-light btn-sm position-absolute start-0 ms-3" href="index.html">
                <i class="fa-solid fa-arrow-left me-1"></i>Voltar
            </a>

            <a class="navbar-brand fw-bold mx-auto" href="index.html">
                <i class="fa-solid fa-laptop-code text-primary me-2"></i>Hackaton
            </a>

            <button class="navbar-toggler position-absolute end-0 me-3" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-4">Listas de Chamada</h1>
        <div class="container py-4">
            <div id="listas-container" class="list-group">
                <!-- Listas serão inseridas aqui -->
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchListas() {
            try {
                const response = await fetch('https://back-end-isvf.onrender.com/listas');
                const listas = await response.json();
                const container = document.getElementById('listas-container');
                container.innerHTML = '';

                listas
                    .sort((a, b) => new Date(b.data) - new Date(a.data))
                    .forEach(lista => {
                        const col = document.createElement('div');
                        col.className = 'col-12 col-md-6 col-lg-4';

                        const card = document.createElement('div');
                        card.className = 'card h-100 shadow-sm';

                        const cardBody = document.createElement('div');
                        cardBody.className = 'card-body d-flex flex-column';

                        const title = document.createElement('h5');
                        title.className = 'card-title';
                        title.textContent = lista.nome;

                        const date = document.createElement('p');
                        date.className = 'card-text text-muted';
                        date.textContent = new Date(lista.data).toLocaleString();

                        const link = document.createElement('a');
                        link.href = lista.url;
                        link.className = 'btn btn-primary mt-auto';
                        link.textContent = 'Abrir lista';

                        cardBody.appendChild(title);
                        cardBody.appendChild(date);
                        cardBody.appendChild(link);
                        card.appendChild(cardBody);
                        col.appendChild(card);
                        container.appendChild(col);
                    });
            } catch (error) {
                console.error('Erro ao buscar listas:', error);
            }
        }
        fetchListas();
    </script>
</body>

</html>
