<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackaton - Painel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --sidebar-width: 220px;
    }

    body {
      background-color: #f8f9fa;
      font-family:
        system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      background: #0f1115;
      color: #fff;
      z-index: 1030;
    }

    .sidebar .nav-label {
      white-space: nowrap;
    }

    .sidebar .nav-link {
      color: #cbd5e1;
      border-radius: 12px;
      margin: 4px 8px;
      gap: 12px;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background: #1f2937;
      color: #fff;
    }

    .sidebar .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 12px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .main-content {
      margin-left: var(--sidebar-width);
      min-height: 100vh;
    }

    .card {
      border: none;
      border-radius: 1.25rem;
      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1) !important;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        position: static;
        width: 100%;
      }

      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <aside class="sidebar d-flex flex-column">
    <div class="brand">
      <i class="fa-solid fa-laptop-code text-primary fs-4"></i>
      <span class="nav-label fw-semibold">Hackaton</span>
    </div>

    <nav class="nav flex-column mt-2 px-1">
      <a class="nav-link d-flex align-items-center active" href="menu.html">
        <i class="fa-solid fa-house fa-lg text-primary"></i>
        <span class="nav-label">Inicio</span>
      </a>
      <a class="nav-link d-flex align-items-center" href="historico.html">
        <i class="fa fa-file-text fa-lg" style="color: #a78bfa"></i>
        <span class="nav-label">Historico</span>
      </a>
      <a class="nav-link d-flex align-items-center" href="qrCode.html">
        <i class="fa-solid fa-qrcode fa-lg text-success"></i>
        <span class="nav-label">QR Presenca</span>
      </a>
      <a class="nav-link d-flex align-items-center" href="sign_matricula.html">
        <i class="fa-solid fa-user-graduate fa-lg text-info"></i>
        <span class="nav-label">Alunos</span>
      </a>
    </nav>
    <div class="mt-auto px-3 pb-3">
      <a class="btn btn-outline-light w-100" href="index.html">
        <i class="fa-solid fa-right-from-bracket me-2"></i>Voltar para Turmas
      </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="container-fluid py-5 px-4 px-lg-5">
      <div class="mb-4">
        <h1 class="fw-bold display-6 text-dark">Painel</h1>
        <p class="text-muted">Acesse as areas principais da chamada.</p>
      </div>
      <div class="row g-4">
        <div class="col-12 col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h5">QR Presenca</h2>
              <p class="text-muted">Gere o QR Code e acompanhe as presencas.</p>
              <a href="qrCode.html" class="btn btn-primary">Abrir</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h5">Historico</h2>
              <p class="text-muted">Veja as listas de chamada salvas.</p>
              <a href="historico.html" class="btn btn-primary">Abrir</a>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h2 class="h5">Alunos</h2>
              <p class="text-muted">Cadastre e gerencie os alunos.</p>
              <a href="sign_matricula.html" class="btn btn-primary">Abrir</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
