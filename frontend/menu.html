<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hackaton - Painel</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    :root { --sidebar-width: 220px; }
    body { background-color: #f8f9fa; font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-width); background: #0f1115; color: #fff; z-index: 1030; }
    .sidebar .nav-label { white-space: nowrap; }
    .sidebar .nav-link { color: #cbd5e1; border-radius: 12px; margin: 4px 8px; gap: 12px; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { background: #1f2937; color: #fff; }
    .sidebar .brand { display:flex; align-items:center; justify-content:center; gap:12px; padding:20px 12px 12px; border-bottom:1px solid rgba(255,255,255,0.08); }
    .main-content { margin-left: var(--sidebar-width); min-height:100vh; }

    .card {
      border: none;
      border-radius: 1.25rem;
      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.1) !important;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        position: static;
        width: 100%;
      }

      .main-content {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <aside class="sidebar d-flex flex-column">
    <div class="brand">
      <span class="nav-label fw-semibold" id="navTurmaNome">Hackaton</span>
    </div>

    <nav class="nav flex-column mt-2 px-1">
      <a class="nav-link d-flex align-items-center active" href="menu.html" data-route="menu.html">
        <i class="fa-solid fa-house fa-lg text-primary"></i>
        <span class="nav-label">Inicio</span>
      </a>
      <a class="nav-link d-flex align-items-center" href="historico.html" data-route="historico.html">
        <i class="fa fa-file-text fa-lg" style="color: #a78bfa"></i>
        <span class="nav-label">Historico</span>
      </a>
      <a class="nav-link d-flex align-items-center" href="qrCode.html" data-route="qrCode.html">
        <i class="fa-solid fa-qrcode fa-lg text-success"></i>
        <span class="nav-label">QR Presenca</span>
      </a>
      <a class="nav-link d-flex align-items-center" href="sign_matricula.html" data-route="sign_matricula.html">
        <i class="fa-solid fa-user-graduate fa-lg text-info"></i>
        <span class="nav-label">Alunos</span>
      </a>
    </nav>
    <div class="mt-auto px-3 pb-3">
      <a class="btn btn-outline-light w-100" href="index.html">
        <i class="fa-solid fa-right-from-bracket me-2"></i>Voltar para Turmas
      </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="container-fluid py-5 px-4 px-lg-5">
      <div class="mb-4">
        <h1 class="fw-bold display-6 text-dark" id="menuTitulo">Painel</h1>
        <p class="text-muted" id="menuSubtitulo">Acesse as areas principais da chamada.</p>
      </div>
      <div class="mt-5">
        <h3 class="h6">Alunos da disciplina</h3>
        <div class="card mt-2">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-sm mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Nome</th>
                    <th>Matrícula</th>
                  </tr>
                </thead>
                <tbody id="alunos-tbody">
                  <tr><td colspan="2" class="text-muted small">Carregando alunos...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const turmaNome = params.get("turma_nome") || "Hackaton";
    const disciplinaNome = params.get("disciplina_nome") || "";

    const navTurmaNome = document.getElementById("navTurmaNome");
    const menuTitulo = document.getElementById("menuTitulo");
    const menuSubtitulo = document.getElementById("menuSubtitulo");

    if (navTurmaNome) {
      navTurmaNome.textContent = turmaNome;
    }

    if (menuTitulo) {
      menuTitulo.textContent = disciplinaNome ? `Painel - ${disciplinaNome}` : "Painel";
    }

    if (menuSubtitulo) {
      menuSubtitulo.textContent = disciplinaNome
        ? `Turma: ${turmaNome}`
        : "Acesse as areas principais da chamada.";
    }

    const links = document.querySelectorAll("[data-route]");
    const query = params.toString();
    links.forEach((link) => {
      link.href = query ? `${link.dataset.route}?${query}` : link.dataset.route;
    });

    // Busca e renderiza alunos da turma
    const alunosTbody = document.getElementById('alunos-tbody');
    const carregarAlunos = async () => {
      if (!alunosTbody) return;
      if (!params.get('turma_id')) {
        alunosTbody.innerHTML = '<tr><td colspan="2" class="text-muted small">Turma não informada.</td></tr>';
        return;
      }
      try {
        const url = `${API_URL}/alunos?turma_id=${encodeURIComponent(params.get('turma_id'))}`;
        const res = await fetch(url);
        if (!res.ok) throw new Error('Falha ao buscar alunos');
        const data = await res.json();
        const alunos = data.alunos || [];
        if (!alunos.length) {
          alunosTbody.innerHTML = '<tr><td colspan="2" class="text-muted small">Nenhum aluno cadastrado nesta turma.</td></tr>';
          return;
        }
        alunosTbody.innerHTML = alunos.map(a => `
          <tr>
            <td>${a.nome || ''}</td>
            <td>${a.matricula || ''}</td>
          </tr>
        `).join('');
      } catch (e) {
        alunosTbody.innerHTML = `<tr><td colspan="2" class="text-danger small">Erro ao carregar alunos</td></tr>`;
      }
    };

    carregarAlunos();
  </script>
</body>

</html>
