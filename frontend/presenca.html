<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar presença</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container position-relative">
            <a class="navbar-brand fw-bold mx-auto" href="index.html">
                <i class="fa-solid fa-laptop-code text-primary me-2"></i>Hackaton
            </a>

            <button class="navbar-toggler position-absolute end-0 me-3" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>
    <main class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Registrar presença</h1>
                        <p class="text-muted mb-4">Preencha seus dados para confirmar a presença.</p>
                        <form id="presenca-form" action="#" method="post">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" id="nome" name="nome" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="matricula" class="form-label">Matrícula</label>
                                <input type="text" id="matricula" name="matricula" class="form-control" required>
                            </div>
                            <input type="hidden" id="token" name="token">
                            <div id="token-alert" class="alert alert-warning d-none" role="alert">
                                Token ausente. Escaneie o QR Code novamente.
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Registrar</button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-muted small mt-3 mb-0">Em caso de erro, contate a coordenação.</p>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const tokenInput = document.getElementById('token');
        const tokenAlert = document.getElementById('token-alert');
        const form = document.getElementById('presenca-form');

        form.action = `${API_URL}/presenca`;

        if (token) {
            tokenInput.value = token;
        } else {
            tokenAlert.classList.remove('d-none');
            form.addEventListener('submit', (event) => {
                event.preventDefault();
            });
        }
    </script>
</body>

</html>
