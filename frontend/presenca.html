<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar presença</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    
    <main class="main-content">
        <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h3 mb-3">Registrar presença</h1>
                        <p class="text-muted mb-4">Preencha seus dados para confirmar a presença.</p>
                        <form id="presenca-form" action="#" method="post">
                            <div class="mb-3">
                                <label for="nome" class="form-label">Nome</label>
                                <input type="text" id="nome" name="nome" class="form-control" required>
                            </div>
                            <div class="mb-4">
                                <label for="matricula" class="form-label">Matrícula</label>
                                <input type="text" id="matricula" name="matricula" class="form-control" required>
                            </div>
                            <input type="hidden" id="token" name="token">
                            <input type="hidden" id="turma_id" name="turma_id">
                            <input type="hidden" id="disciplina_id" name="disciplina_id">
                            <div id="token-alert" class="alert alert-warning d-none" role="alert">
                                Token ausente. Escaneie o QR Code novamente.
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Registrar</button>
                        </form>
                    </div>
                </div>
                <p class="text-center text-muted small mt-3 mb-0">Em caso de erro, contate a coordenação.</p>
            </div>
        </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const tokenInput = document.getElementById('token');
        const turmaIdInput = document.getElementById('turma_id');
        const disciplinaIdInput = document.getElementById('disciplina_id');
        const tokenAlert = document.getElementById('token-alert');
        const form = document.getElementById('presenca-form');

        form.action = `${API_URL}/presenca`;

        if (token) {
            tokenInput.value = token;
            turmaIdInput.value = params.get('turma_id') || '';
            disciplinaIdInput.value = params.get('disciplina_id') || '';
        } else {
            tokenAlert.classList.remove('d-none');
            form.addEventListener('submit', (event) => {
                event.preventDefault();
            });
        }
    </script>
    <style>
        :root {
            --sidebar-width: 220px;
        }

        body {
            font-family:
                system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--sidebar-width);
            background: #0f1115;
            color: #fff;
            z-index: 1030;
        }

        .sidebar .nav-label {
            white-space: nowrap;
        }

        .sidebar .nav-link {
            color: #cbd5e1;
            border-radius: 12px;
            margin: 4px 8px;
            gap: 12px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: #1f2937;
            color: #fff;
        }

        .sidebar .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 12px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                position: static;
                width: 100%;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</body>

</html>
