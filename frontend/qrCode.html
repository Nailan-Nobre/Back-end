<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qr-Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 220px;
        }

        body {
            background-color: #f8f9fa;
            font-family:
                system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        }

        .sidebar {
            position: fixed;
            inset: 0 auto 0 0;
            width: var(--sidebar-width);
            background: #0f1115;
            color: #fff;
            z-index: 1030;
        }

        .sidebar .nav-label {
            white-space: nowrap;
        }

        .sidebar .nav-link {
            color: #cbd5e1;
            border-radius: 12px;
            margin: 4px 8px;
            gap: 12px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: #1f2937;
            color: #fff;
        }

        .sidebar .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 12px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
        }


        .qr-frame {
            width: 100%;
            max-width: 450px;
            aspect-ratio: 1 / 1;
        }

        .qr-placeholder,
        .qr-image {
            width: 100%;
            height: 100%;
        }

        .qr-image {
            object-fit: contain;
        }

        @media (max-width: 991.98px) {
            .sidebar {
                position: static;
                width: 100%;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar d-flex flex-column">
        <div class="brand">
            <i class="fa-solid fa-laptop-code text-primary fs-4"></i>
            <span class="nav-label fw-semibold">Hackaton</span>
        </div>

        <nav class="nav flex-column mt-2 px-1">
            <a class="nav-link d-flex align-items-center" href="menu.html">
                <i class="fa-solid fa-house fa-lg text-primary"></i>
                <span class="nav-label">Inicio</span>
            </a>
            <a class="nav-link d-flex align-items-center" href="historico.html">
                <i class="fa fa-file-text fa-lg" style="color: #a78bfa"></i>
                <span class="nav-label">Historico</span>
            </a>
            <a class="nav-link d-flex align-items-center active" href="qrCode.html">
                <i class="fa-solid fa-qrcode fa-lg text-success"></i>
                <span class="nav-label">QR Presenca</span>
            </a>
            <a class="nav-link d-flex align-items-center" href="sign_matricula.html">
                <i class="fa-solid fa-user-graduate fa-lg text-info"></i>
                <span class="nav-label">Alunos</span>
            </a>
        </nav>
        <div class="mt-auto px-3 pb-3">
            <a class="btn btn-outline-light w-100" href="index.html">
                <i class="fa-solid fa-right-from-bracket me-2"></i>Voltar para Turmas
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="container-fluid py-5 px-4 px-lg-5">
        <div class="row g-4 align-items-start">
            <div class="col-12 col-lg-6 text-center">
                <h1 class="h3 mb-4">Escaneie o QR Code para registrar presença</h1>
                <div class="qr-frame mx-auto">
                    <div id="qr-loader" class="qr-placeholder border rounded shadow-sm bg-white d-flex flex-column justify-content-center align-items-center">
                        <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status" aria-hidden="true"></div>
                        <div id="qr-loader-text" class="mt-3 text-muted">Gerando QR Code...</div>
                    </div>
                    <img id="qr-image" alt="QR Code" class="qr-image border rounded shadow-sm d-none">
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                            <h2 class="h5 mb-0">Presenças registradas</h2>
                            <button id="btn-encerrar" class="btn btn-outline-danger btn-sm">
                                <i class="fa-solid fa-flag-checkered me-1"></i>Encerrar chamada
                            </button>
                        </div>
                        <div id="encerrar-status" class="small text-muted mb-2"></div>
                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">Nome</th>
                                        <th scope="col">Matrícula</th>
                                    </tr>
                                </thead>
                                <tbody id="presencas-body"></tbody>
                            </table>
                        </div>
                        <div id="presencas-empty" class="text-muted small mt-3">
                            Nenhuma presença registrada ainda.
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <script>
        const qrImage = document.getElementById('qr-image');
        const qrLoader = document.getElementById('qr-loader');
        const qrLoaderText = document.getElementById('qr-loader-text');
        const presencasBody = document.getElementById('presencas-body');
        const presencasEmpty = document.getElementById('presencas-empty');
        const btnEncerrar = document.getElementById('btn-encerrar');
        const encerrarStatus = document.getElementById('encerrar-status');
        let presencasStarted = false;
        const setEncerrarStatus = (message, tone) => {
            if (!encerrarStatus) return;
            encerrarStatus.textContent = message || '';
            encerrarStatus.className = `small mb-2 ${tone || 'text-muted'}`;
        };

        const encerrarChamada = async () => {
            if (!btnEncerrar) return;
            const confirmed = confirm('Deseja encerrar a chamada de hoje?');
            if (!confirmed) return;
            const titulo = prompt('Título da chamada (opcional):') || '';

            btnEncerrar.disabled = true;
            setEncerrarStatus('Encerrando chamada...', 'text-muted');

            try {
                const response = await fetch(`${API_URL}/encerrar-chamada`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo }),
                });
                if (!response.ok) {
                    throw new Error('Falha ao encerrar chamada');
                }
                setEncerrarStatus('Chamada encerrada e lista salva com sucesso.', 'text-success');
                refreshPresencas();
            } catch (error) {
                setEncerrarStatus('Não foi possível encerrar a chamada.', 'text-danger');
            } finally {
                btnEncerrar.disabled = false;
            }
        };

        if (btnEncerrar) {
            btnEncerrar.addEventListener('click', encerrarChamada);
        }


        const showQrLoading = (message) => {
            if (!qrLoader || !qrImage) return;
            qrLoader.classList.remove('d-none');
            qrImage.classList.add('d-none');
            if (qrLoaderText) {
                qrLoaderText.textContent = message || 'Gerando QR Code...';
            }
        };

        const showQrImage = () => {
            if (!qrLoader || !qrImage) return;
            qrLoader.classList.add('d-none');
            qrImage.classList.remove('d-none');
        };

        const refreshQr = () => {
            showQrLoading('Gerando QR Code...');
            qrImage.src = `${API_URL}/qr-code?t=${Date.now()}`;
        };

        const renderPresencas = (registros) => {
            presencasBody.innerHTML = '';
            if (!Array.isArray(registros) || registros.length === 0) {
                presencasEmpty.classList.remove('d-none');
                return;
            }

            presencasEmpty.classList.add('d-none');
            registros.forEach((registro) => {
                const row = document.createElement('tr');

                const nomeCell = document.createElement('td');
                nomeCell.textContent = registro.nome || '';

                const matriculaCell = document.createElement('td');
                matriculaCell.textContent = registro.matricula || '';

                row.appendChild(nomeCell);
                row.appendChild(matriculaCell);
                presencasBody.appendChild(row);
            });
        };

        const refreshPresencas = async () => {
            try {
                const response = await fetch(`${API_URL}/presencas`);
                if (!response.ok) {
                    throw new Error('Falha ao buscar presenças');
                }
                const data = await response.json();
                renderPresencas(data.registros || []);
            } catch (error) {
                console.warn('Não foi possível carregar as presenças.');
            }
        };

        const startRefresh = () => {
            const intervalMs = 60000;
            refreshQr();
            setInterval(refreshQr, intervalMs);
        };

        const startPresencas = () => {
            refreshPresencas();
            setInterval(refreshPresencas, 5000);
        };

        startRefresh();

        qrImage.addEventListener('load', () => {
            showQrImage();
            if (!presencasStarted) {
                startPresencas();
                presencasStarted = true;
            }
        });
        qrImage.addEventListener('error', () => {
            showQrLoading('Falha ao carregar. Tentando novamente...');
            if (!presencasStarted) {
                startPresencas();
                presencasStarted = true;
            }
        });
    </script>
</body>

</html>
