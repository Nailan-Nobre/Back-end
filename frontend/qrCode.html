<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qr-Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">
                <h1 class="h3 mb-4">Escaneie o QR Code para registrar presença</h1>
                <img id="qr-image" alt="QR Code" class="img-fluid">
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ─── Troque pela URL real do seu backend no Render ───────────────────
        const API_URL = "https://back-end-isvf.onrender.com";
        // ─────────────────────────────────────────────────────────────────────

        const qrImage = document.getElementById('qr-image');

        const refreshQr = () => {
            qrImage.src = `${API_URL}/qr-code?t=${Date.now()}`;
        };

        const startRefresh = async () => {
            let intervalMs = 30000;
            try {
                const response = await fetch(`${API_URL}/qr-config`);
                if (response.ok) {
                    const data = await response.json();
                    if (Number.isFinite(data.valid_seconds)) {
                        intervalMs = Math.max(1000, data.valid_seconds * 1000);
                    }
                }
            } catch (error) {
                console.warn("Não foi possível obter configuração do QR. Usando padrão de 30s.");
            }

            refreshQr();
            setInterval(refreshQr, intervalMs);
        };

        startRefresh();
    </script>
</body>

</html>
