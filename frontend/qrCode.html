<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qr-Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            padding-bottom: 84px;
        }

        .nav-icon {
            font-size: 1.4rem;
        }

        @media (min-width: 992px) {
            body {
                padding-bottom: 0;
            }
        }

        @media (max-width: 991.98px) {
            .desktop-nav {
                display: none;
            }

            .mobile-nav {
                position: fixed;
                inset: auto 0 0 0;
                height: 64px;
                background: #0f1115;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
                z-index: 1030;
            }

            .mobile-nav .nav-link {
                color: #cbd5e1;
                padding: 8px 10px;
            }

            .mobile-nav .nav-link.active,
            .mobile-nav .nav-link:hover {
                color: #fff;
            }
        }
    </style>
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm desktop-nav">
        <div class="container position-relative">
            <a class="navbar-brand fw-bold mx-auto" href="index.html">
                <i class="fa-solid fa-laptop-code text-primary me-2"></i>Hackaton
            </a>

            <button class="navbar-toggler position-absolute end-0 me-3" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <div class="row g-4 align-items-start">
            <div class="col-12 col-lg-6 text-center">
                <h1 class="h3 mb-4">Escaneie o QR Code para registrar presença</h1>
                <img id="qr-image" alt="QR Code" class="img-fluid border rounded shadow-sm" style="max-width: 450px;">
            </div>

            <div class="col-12 col-lg-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="h5 mb-3">Presenças registradas</h2>
                        <div class="table-responsive">
                            <table class="table table-sm align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th scope="col">Nome</th>
                                        <th scope="col">Matrícula</th>
                                    </tr>
                                </thead>
                                <tbody id="presencas-body"></tbody>
                            </table>
                        </div>
                        <div id="presencas-empty" class="text-muted small mt-3">
                            Nenhuma presença registrada ainda.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="config.js"></script>
    <nav class="mobile-nav d-lg-none">
        <div class="container h-100">
            <div class="nav h-100 justify-content-around align-items-center">
                <a class="nav-link" href="index.html" aria-label="Início">
                    <i class="fa-solid fa-house nav-icon"></i>
                </a>
                <a class="nav-link active" href="qrCode.html" aria-label="QR Presença">
                    <i class="fa-solid fa-qrcode nav-icon text-success"></i>
                </a>
                <a class="nav-link" href="presenca.html" aria-label="Presença">
                    <i class="fa-solid fa-user-check nav-icon text-primary"></i>
                </a>
            </div>
        </div>
    </nav>
    <script>
        const qrImage = document.getElementById('qr-image');
        const presencasBody = document.getElementById('presencas-body');
        const presencasEmpty = document.getElementById('presencas-empty');

        const refreshQr = () => {
            qrImage.src = `${API_URL}/qr-code?t=${Date.now()}`;
        };

        const renderPresencas = (registros) => {
            presencasBody.innerHTML = '';
            if (!Array.isArray(registros) || registros.length === 0) {
                presencasEmpty.classList.remove('d-none');
                return;
            }

            presencasEmpty.classList.add('d-none');
            registros.forEach((registro) => {
                const row = document.createElement('tr');

                const nomeCell = document.createElement('td');
                nomeCell.textContent = registro.nome || '';

                const matriculaCell = document.createElement('td');
                matriculaCell.textContent = registro.matricula || '';

                row.appendChild(nomeCell);
                row.appendChild(matriculaCell);
                presencasBody.appendChild(row);
            });
        };

        const refreshPresencas = async () => {
            try {
                const response = await fetch(`${API_URL}/presencas`);
                if (!response.ok) {
                    throw new Error('Falha ao buscar presenças');
                }
                const data = await response.json();
                renderPresencas(data.registros || []);
            } catch (error) {
                console.warn('Não foi possível carregar as presenças.');
            }
        };

        const startRefresh = () => {
            const intervalMs = 60000;
            refreshQr();
            setInterval(refreshQr, intervalMs);
        };

        const startPresencas = () => {
            refreshPresencas();
            setInterval(refreshPresencas, 5000);
        };

        startRefresh();

        qrImage.addEventListener('load', startPresencas, { once: true });
        qrImage.addEventListener('error', startPresencas, { once: true });
    </script>
</body>

</html>
